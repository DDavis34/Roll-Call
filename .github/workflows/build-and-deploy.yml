name: Build and Deploy to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install
        working-directory: PF2EGM

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./wwwroot/app.css -o ./wwwroot/app.built.css --minify
        working-directory: PF2EGM

      - name: Restore dependencies
        run: dotnet restore PF2EGM/PF2EGM.csproj

      - name: Build
        run: dotnet build PF2EGM/PF2EGM.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish PF2EGM/PF2EGM.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'RollCallPF2E'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish